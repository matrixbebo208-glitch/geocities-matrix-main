<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Login | GeoCities Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; }
        .matrix-border { border: 1px solid #00ff41; box-shadow: 0 0 10px rgba(0,255,65,0.2); }
        input { background: #000; border: 1px solid #004411; color: #00ff41; }
        input:focus { border-color: #00ff41; outline: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="matrix-border p-8 rounded-lg w-96 bg-black">
        <h2 class="text-2xl font-bold mb-6 text-center tracking-widest">إثبات الهوية</h2>
        <form>
            <div class="mb-4">
                <label class="block text-xs mb-2 text-green-800">USERNAME</label>
                <input type="text" id="user" class="w-full p-2 rounded text-sm uppercase">
            </div>
            <div class="mb-6">
                <label class="block text-xs mb-2 text-green-800">ACCESS CODE</label>
                <input type="password" id="pass" class="w-full p-2 rounded text-sm">
            </div>
            <button type="button" onclick="checkAuth()" class="w-full bg-green-600 text-black font-bold py-2 rounded hover:bg-white transition">تخطي الجدار الناري 🛡️</button>
        </form>
        <p class="text-[10px] mt-4 text-center text-gray-600">للحصول على حساب: حول 30ج لـ 01224815487</p>
    </div>

    <script>
        function checkAuth() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            // مؤقتاً لحد ما نربط الداتابيز
            if(user === "admin" && pass === "matrix30") {
                window.location.href = "dashboard.html"; 
            } else {
                alert("تم رصد محاولة دخول غير مصرح بها!");
            }
        }
    </script>
</body>
</html>
